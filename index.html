<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Bergtouren</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:#f3f6f3;
color:#20342b
}

header{
padding:28px 20px 34px;
color:#fff;
background:linear-gradient(135deg,#204c3b,#718a73);
border-radius:0 0 28px 28px
}

main{
max-width:900px;
margin:auto;
padding:18px
}

h1{
margin:0 0 5px;
font-size:29px
}

.muted{opacity:.85}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:-8px
}

.stat,.card,.modalbox{
background:#fff;
border-radius:18px;
padding:16px;
box-shadow:0 3px 16px #0001
}

.stat b{
font-size:22px;
display:block
}

.stat small{color:#718078}

.toolbar{
display:flex;
gap:9px;
flex-wrap:wrap;
margin:18px 0
}

.btn{
border:0;
border-radius:12px;
padding:11px 15px;
background:#2f6751;
color:#fff;
font-weight:700;
cursor:pointer
}

.btn.alt{
background:#e4ece7;
color:#2d4b3d
}

.btn.red{
background:#b84b4b;
color:#fff
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:14px
}

.card{
cursor:pointer
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
margin-bottom:10px
}

.card h3{
margin:8px 0 5px
}

.meta{
font-size:13px;
color:#66756c;
margin:7px 0
}

.badge{
display:inline-block;
border-radius:99px;
padding:5px 9px;
background:#e7f1eb;
color:#286044;
font-size:12px;
font-weight:700
}

.card p{
line-height:1.45
}

.empty{
text-align:center;
padding:35px;
color:#738078
}

.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:16px;
z-index:10
}

.modal.open{
display:flex
}

.modalbox{
max-width:540px;
width:100%;
max-height:92vh;
overflow:auto
}

.close{
float:right
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
display:block;
font-weight:700;
font-size:13px;
margin:12px 0 5px
}

input,textarea,select{
width:100%;
padding:11px;
border:1px solid #ccd6d0;
border-radius:10px;
font:inherit
}

textarea{
min-height:85px
}

.link{
color:#2f6751;
font-weight:700
}

.info{
background:#f0f5f1;
border-radius:12px;
padding:10px;
margin:10px 0
}

.status{
text-align:center;
padding:8px;
border-radius:10px;
background:#eef4ef;
margin:10px 0;
font-size:13px
}

.gallery{
display:flex;
gap:7px;
overflow:auto;
margin-top:8px
}

.gallery img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px
}

.detail-cover{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:14px;
margin-bottom:14px
}

.detail-title{
font-size:28px;
margin:5px 0 12px
}

.detail-section{
background:#f0f5f1;
border-radius:14px;
padding:13px;
margin:12px 0
}

.detail-buttons{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:16px
}

.share-info{
background:#eef4ef;
border-radius:12px;
padding:10px;
margin-top:10px;
font-size:13px
}

@media(max-width:520px){

.stats{
grid-template-columns:1fr 1fr
}

.stat:last-child{
grid-column:span 2
}

.row{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>
<h1>🏔️ Meine Bergtouren</h1>
<div class="muted">Deine persönliche Sammlung von Touren</div>
</header>

<main>

<div id="connection" class="status">
☁️ Verbindung wird hergestellt...
</div>

<div class="stats">

<div class="stat">
<b id="planned">0</b>
<small>Geplant</small>
</div>

<div class="stat">
<b id="done">0</b>
<small>Erledigt</small>
</div>

<div class="stat">
<b id="hm">0</b>
<small>Höhenmeter gesamt</small>
</div>

</div>

<div class="toolbar">

<button class="btn" onclick="openModal()">
＋ Tour hinzufügen
</button>

<button class="btn alt" onclick="filter='all';render()">
Alle
</button>

<button class="btn alt" onclick="filter='planned';render()">
Geplant
</button>

<button class="btn alt" onclick="filter='done';render()">
Erledigt
</button>

</div>

<div id="list" class="grid"></div>

</main>


<!-- DETAILANSICHT -->

<div id="detailModal" class="modal">

<div class="modalbox">

<button class="btn alt close" onclick="closeDetail()">
Schließen
</button>

<div id="detailContent"></div>

</div>
</div>


<!-- NEUE TOUR / BEARBEITEN -->

<div id="modal" class="modal">

<div class="modalbox">

<button class="btn alt close" onclick="closeModal()">
Schließen
</button>

<h2 id="modalTitle">Neue Bergtour</h2>

<form id="form">

<input id="editId" type="hidden">

<label>Berg / Tour *</label>
<input
id="title"
required
placeholder="z. B. Hochstaufen"
>

<label>Titelbild</label>
<input
id="cover"
type="file"
accept="image/*"
>

<label>Ort des Berges</label>
<input
id="place"
placeholder="z. B. Ramsau bei Berchtesgaden"
>

<label>🅿️ Parkplatz</label>
<input
id="parking"
placeholder="z. B. Parkplatz Halswald"
>

<label>🗺️ Google-Maps-Link zum Parkplatz</label>
<input
id="parkingLink"
type="url"
placeholder="https://maps.google.com/..."
>

<div class="row">

<div>
<label>Fahrzeit</label>
<input
id="drive"
placeholder="z. B. 35 Min."
>
</div>

<div>
<label>HM zum Gehen</label>
<input
id="elev"
type="number"
placeholder="z. B. 850"
>
</div>

</div>

<div class="row">

<div>
<label>Gesamthöhenmeter vom Berg</label>
<input
id="totalElev"
type="number"
placeholder="z. B. 1350"
>
</div>

<div>
<label>Gehzeit</label>
<input
id="time"
placeholder="z. B. 5:30 h"
>
</div>

</div>

<div class="row">

<div>
<label>Entfernung (km)</label>
<input
id="km"
type="number"
step=".1"
>
</div>

<div>

<label>Schwierigkeit</label>

<select id="difficulty">
<option>leicht</option>
<option selected>mittel</option>
<option>schwer</option>
</select>

</div>

</div>

<label>Outdooractive-Link</label>
<input
id="oa"
type="url"
placeholder="https://www.outdooractive.com/..."
>

<label>Beschreibung</label>

<textarea
id="desc"
placeholder="Besonderheiten, Hinweise usw."
></textarea>

<label>Weitere Fotos</label>

<input
id="photos"
type="file"
accept="image/*"
multiple
>

<label>Status</label>

<select id="status">

<option value="planned">
🥾 Geplant
</option>

<option value="done">
✅ Bereits gegangen
</option>

</select>

<label>Begehungsdatum</label>

<input
id="date"
type="date"
>

<br><br>

<button
class="btn"
type="submit"
>
💾 Tour speichern
</button>

</form>

</div>
</div>


<script>

const SUPABASE_URL=
"https://wklyvofseereubtelpha.supabase.co";

const SUPABASE_KEY=
"sb_publishable_TvoavcCRENtHJwBuXpp1tg_E9WsbMZx";

const API=
SUPABASE_URL+"/rest/v1/touren";

let tours=[];

let filter="all";

let currentDetailId=null;

const $=id=>
document.getElementById(id);


function headers(){

return{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json"

};

}


function setConnection(text,ok=true){

$("connection").textContent=text;

$("connection").style.background=
ok?
"#eef4ef":
"#fbeaea";

}


function esc(s){

return String(s??"").replace(
/[&<>"']/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);

}


function safeUrl(url){

if(!url)return "";

try{

let u=new URL(url);

if(
u.protocol==="https:"||
u.protocol==="http:"
){

return esc(url);

}

}catch(e){}

return "";

}


async function loadTours(){

try{

setConnection(
"☁️ Touren werden geladen..."
);

let response=
await fetch(
API+
"?select=*&order=created_at.desc",
{
headers:headers()
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

tours=
await response.json();

setConnection(
"☁️ Mit der Bergtouren-Datenbank verbunden"
);

render();

}catch(error){

console.error(error);

setConnection(
"❌ Verbindung zur Datenbank fehlgeschlagen",
false
);

$("list").innerHTML=`

<div class="empty">

Die Touren konnten nicht geladen werden.

<br><br>

Bitte überprüfe die Supabase-Einstellungen.

</div>

`;

}

}


async function saveTour(tour){

let response;

if(tour.id){

response=
await fetch(
API+
"?id=eq."+
encodeURIComponent(tour.id),
{

method:"PATCH",

headers:{
...headers(),
"Prefer":
"return=representation"
},

body:JSON.stringify(tour)

}
);

}else{

response=
await fetch(
API,
{

method:"POST",

headers:{
...headers(),
"Prefer":
"return=representation"
},

body:JSON.stringify(tour)

}
);

}

if(!response.ok){

throw new Error(
await response.text()
);

}

return await response.json();

}


async function deleteTour(id){

let response=
await fetch(
API+
"?id=eq."+
encodeURIComponent(id),
{
method:"DELETE",
headers:headers()
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

}


function openModal(id=null){

$("modal").classList.add("open");

$("form").reset();

$("editId").value="";

$("modalTitle").textContent=
id?
"Tour bearbeiten":
"Neue Bergtour";

if(id){

let t=
tours.find(
x=>String(x.id)===String(id)
);

if(!t)return;

$("editId").value=t.id;

$("title").value=
t.title||"";

$("place").value=
t.place||"";

$("parking").value=
t.parking||"";

$("parkingLink").value=
t.parking_link||"";

$("drive").value=
t.drive||"";

$("elev").value=
t.elev||"";

$("totalElev").value=
t.total_elev||"";

$("time").value=
t.tour_time||"";

$("km").value=
t.km||"";

$("difficulty").value=
t.difficulty||"mittel";

$("oa").value=
t.outdooractive||"";

$("desc").value=
t.description||"";

$("status").value=
t.status||"planned";

$("date").value=
t.tour_date||"";

}

}


function closeModal(){

$("modal").classList.remove("open");

$("form").reset();

$("editId").value="";

}


function readFile(file){

return new Promise(resolve=>{

if(!file){

resolve("");

return;

}

let reader=
new FileReader();

reader.onload=()=>
resolve(reader.result);

reader.onerror=()=>
resolve("");

reader.readAsDataURL(file);

});

}


async function readPhotos(){

return Promise.all(
[...$("photos").files]
.map(file=>readFile(file))
);

}


$("form").onsubmit=
async e=>{

e.preventDefault();

let button=e.submitter;

button.disabled=true;

button.textContent=
"⏳ Speichern...";

try{

let id=
$("editId").value;

let old=
id?
tours.find(
x=>String(x.id)===String(id)
):
null;


let cover=
old?.cover||"";

if($("cover").files[0]){

cover=
await readFile(
$("cover").files[0]
);

}


let photos=
old?.photos||[];

if($("photos").files.length){

let newPhotos=
await readPhotos();

photos=[
...photos,
...newPhotos
];

}


let tour={

title:
$("title").value.trim(),

cover:
cover,

place:
$("place").value.trim(),

parking:
$("parking").value.trim(),

parking_link:
$("parkingLink").value.trim(),

drive:
$("drive").value.trim(),

elev:
+$("elev").value||0,

total_elev:
+$("totalElev").value||0,

tour_time:
$("time").value.trim(),

km:
+$("km").value||0,

difficulty:
$("difficulty").value,

description:
$("desc").value.trim(),

outdooractive:
$("oa").value.trim(),

status:
$("status").value,

tour_date:
$("date").value||null,

photos:
photos

};


if(id){

tour.id=id;

}


await saveTour(tour);

await loadTours();

closeModal();

}catch(error){

console.error(error);

alert(
"Die Tour konnte nicht gespeichert werden.\n\n"+
error.message
);

}

button.disabled=false;

button.textContent=
"💾 Tour speichern";

};


function openDetail(id){

let t=
tours.find(
x=>String(x.id)===String(id)
);

if(!t)return;

currentDetailId=t.id;

let image=
t.cover||
t.photos?.[0]||
"";

let oa=
safeUrl(t.outdooractive);

let parkingLink=
safeUrl(t.parking_link);


$("detailContent").innerHTML=`

${
image?

`<img
class="detail-cover"
src="${image}"
alt="${esc(t.title)}"
>`

:""
}


<div class="detail-title">
🏔️ ${esc(t.title)}
</div>


<span class="badge">

${
t.status==="done"?
"✅ Erledigt":
"🥾 Geplant"
}

</span>


${
t.place?

`<div class="detail-section">

<div class="meta">
📍 <b>Ort:</b>
${esc(t.place)}
</div>

</div>`

:""
}


${
t.parking || parkingLink?

`<div class="detail-section">

${
t.parking?

`<div class="meta">
🅿️ <b>Parkplatz:</b>
${esc(t.parking)}
</div>`

:""
}


${
parkingLink?

`<button
class="btn"
onclick="openParking()"
>
🗺️ Parkplatz in Google Maps öffnen
</button>`

:""
}

</div>`

:""
}


<div class="detail-section">

<div class="meta">
🚗 <b>Fahrzeit:</b>
${
t.drive?
esc(t.drive):
"nicht angegeben"
}
</div>


<div class="meta">
⬆️ <b>HM zum Gehen:</b>
${t.elev||0} HM
</div>


<div class="meta">
⛰️ <b>Gesamthöhenmeter:</b>
${t.total_elev||0} HM
</div>


<div class="meta">
🥾 <b>Gehzeit:</b>
${
t.tour_time?
esc(t.tour_time):
"nicht angegeben"
}
</div>


<div class="meta">
📏 <b>Strecke:</b>
${t.km||0} km
</div>


<div class="meta">
⭐ <b>Schwierigkeit:</b>
${esc(t.difficulty||"mittel")}
</div>

</div>


${
t.description?

`<div class="detail-section">

<b>📝 Beschreibung</b>

<p>
${esc(t.description)}
</p>

</div>`

:""
}


${
t.tour_date?

`<div class="meta">

📅 <b>Begehungsdatum:</b>

${
new Date(
t.tour_date+"T12:00:00"
).toLocaleDateString("de-DE")
}

</div>`

:""
}


${
oa?

`<div class="detail-section">

<a
class="link"
href="${oa}"
target="_blank"
rel="noopener"
>
🗺️ Outdooractive öffnen
</a>

</div>`

:""
}


${
t.photos?.length?

`<div class="detail-section">

<b>📷 Fotos</b>

<div class="gallery">

${
t.photos.map(p=>`

<img
src="${p}"
alt=""
>

`).join("")
}

</div>

</div>`

:""
}


<div class="detail-buttons">

<button
class="btn"
onclick="shareTour()"
>
📤 Tour mit Fotos teilen
</button>


<button
class="btn alt"
onclick="editCurrentTour()"
>
✏️ Bearbeiten
</button>


<button
class="btn alt"
onclick="closeDetail()"
>
Schließen
</button>

</div>


<div class="share-info">

📤 Beim Teilen versucht die App,
den Tourtext und <b>alle vorhandenen Bilder</b>
gemeinsam über das Android-Teilen-Menü zu übergeben.

</div>

`;

$("detailModal").classList.add("open");

}


function closeDetail(){

$("detailModal").classList.remove("open");

currentDetailId=null;

}


function editCurrentTour(){

if(currentDetailId===null)return;

let id=currentDetailId;

closeDetail();

openModal(id);

}


function openParking(){

let t=
tours.find(
x=>String(x.id)===String(currentDetailId)
);

if(!t)return;

let url=
safeUrl(t.parking_link);

if(!url)return;

window.open(
url,
"_blank"
);

}


async function shareTour(){

let t=
tours.find(
x=>String(x.id)===String(currentDetailId)
);

if(!t)return;


let text=
"🏔️ "+
(t.title||"Bergtour")+
"\n\n";


if(t.place)
text+=
"📍 Ort: "+
t.place+
"\n";

if(t.parking)
text+=
"🅿️ Parkplatz: "+
t.parking+
"\n";

if(t.parking_link)
text+=
"🗺️ Parkplatz: "+
t.parking_link+
"\n";

if(t.drive)
text+=
"🚗 Fahrzeit: "+
t.drive+
"\n";

if(t.elev)
text+=
"⬆️ HM zum Gehen: "+
t.elev+
" HM\n";

if(t.total_elev)
text+=
"⛰️ Gesamthöhenmeter: "+
t.total_elev+
" HM\n";

if(t.tour_time)
text+=
"🥾 Gehzeit: "+
t.tour_time+
"\n";

if(t.km)
text+=
"📏 Strecke: "+
t.km+
" km\n";

if(t.difficulty)
text+=
"⭐ Schwierigkeit: "+
t.difficulty+
"\n";

if(t.description)
text+=
"\n📝 "+
t.description+
"\n";

if(t.outdooractive)
text+=
"\n🗺️ Outdooractive: "+
t.outdooractive;


let images=[];


if(t.cover){

images.push(t.cover);

}


if(
Array.isArray(t.photos)
){

images=[
...images,
...t.photos
];

}


/* doppelte Bilder entfernen */

images=[
...new Set(images)
];


try{

/*
Bilder in Dateien umwandeln.
Das funktioniert auch bei den
gespeicherten Data-URL-Bildern.
*/

let files=[];


for(
let i=0;
i<images.length;
i++
){

try{

let response=
await fetch(images[i]);

let blob=
await response.blob();

let extension=
(blob.type||"image/jpeg")
.split("/")[1]||
"jpg";


let file=
new File(
[blob],
"berg-tour-"+(i+1)+"."+extension,
{
type:
blob.type||
"image/jpeg"
}
);


files.push(file);

}catch(error){

console.log(
"Bild konnte nicht vorbereitet werden:",
error
);

}

}


/*
Wenn Android das Teilen von
mehreren Dateien unterstützt:
Text + ALLE Bilder
*/

if(
files.length &&
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:files
})
){

await navigator.share({

title:
t.title||
"Meine Bergtour",

text:text,

files:files

});

return;

}


/*
Falls das Gerät keine Bilder
gemeinsam teilen kann:
Text teilen.
*/

if(navigator.share){

await navigator.share({

title:
t.title||
"Meine Bergtour",

text:text

});

return;

}


/*
Letzter Fallback:
Text in Zwischenablage.
*/

if(navigator.clipboard){

await navigator.clipboard.writeText(text);

alert(
"Die Tourdaten wurden in die Zwischenablage kopiert."
);

}

}catch(error){

console.log(error);

if(
error.name!=="AbortError"
){

alert(
"Die Tour konnte nicht geteilt werden."
);

}

}

}


async function toggle(id){

let t=
tours.find(
x=>String(x.id)===String(id)
);

if(!t)return;

let newStatus=
t.status==="done"?
"planned":
"done";


let update={

status:
newStatus,

tour_date:
newStatus==="done"?
(
t.tour_date||
new Date()
.toISOString()
.slice(0,10)
):
null

};


try{

setConnection(
"☁️ Änderung wird gespeichert..."
);

let response=
await fetch(

API+
"?id=eq."+
encodeURIComponent(id),

{

method:"PATCH",

headers:{
...headers(),
"Prefer":
"return=minimal"
},

body:
JSON.stringify(update)

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


await loadTours();

}catch(error){

console.error(error);

alert(
"Änderung konnte nicht gespeichert werden."
);

}

}


async function removeTour(id){

if(!confirm(
"Tour wirklich löschen?"
))return;


try{

setConnection(
"☁️ Tour wird gelöscht..."
);

await deleteTour(id);

await loadTours();

}catch(error){

console.error(error);

alert(
"Tour konnte nicht gelöscht werden."
);

}

}


function openTourFromCard(event){

if(
event.target.closest("button")||
event.target.closest("a")
){

return;

}

let card=
event.currentTarget;

let id=
card.getAttribute("data-id");

if(!id)return;

openDetail(id);

}


function render(){

$("planned").textContent=
tours.filter(
t=>t.status==="planned"
).length;


$("done").textContent=
tours.filter(
t=>t.status==="done"
).length;


$("hm").textContent=
tours.reduce(
(a,t)=>
a+(+t.elev||0),
0
).toLocaleString("de-DE");


let arr=
tours.filter(
t=>
filter==="all"||
t.status===filter
);


$("list").innerHTML=
arr.length?

arr.map(t=>{

let image=
t.cover||
t.photos?.[0]||
"";


let tourId=
String(t.id).replace(
/"/g,
"&quot;"
);


return `

<article
class="card"
data-id="${tourId}"
onclick="openTourFromCard(event)"
>


${
image?

`<img
src="${image}"
alt="${esc(t.title)}"
>`

:""
}


<span class="badge">

${
t.status==="done"?
"✅ Erledigt":
"🥾 Geplant"
}

</span>


<h3>
${esc(t.title)}
</h3>


${
t.place?

`<div class="meta">
📍 ${esc(t.place)}
</div>`

:""
}


${
t.parking?

`<div class="meta">
🅿️ ${esc(t.parking)}
</div>`

:""
}


<div class="info">


<div class="meta">

🚗 <b>Fahrzeit:</b>

${
t.drive?
esc(t.drive):
"nicht angegeben"
}

</div>


<div class="meta">

⬆️ <b>HM zum Gehen:</b>

${t.elev||0} HM

</div>


<div class="meta">

⛰️ <b>Gesamthöhenmeter:</b>

${t.total_elev||0} HM

</div>


<div class="meta">

🥾 <b>Gehzeit:</b>

${
t.tour_time?
esc(t.tour_time):
"nicht angegeben"
}

</div>


<div class="meta">

📏 <b>Strecke:</b>

${t.km||0} km

</div>


<div class="meta">

⭐ <b>Schwierigkeit:</b>

${esc(
t.difficulty||"mittel"
)}

</div>


</div>


<p>

${esc(
t.description||
"Keine Beschreibung"
)}

</p>


<div class="toolbar">


<button
class="btn"
onclick="
event.stopPropagation();
toggle('${tourId}')
"
>

${
t.status==="done"?
"↩ Wieder planen":
"✅ Als gegangen markieren"
}

</button>


<button
class="btn alt"
onclick="
event.stopPropagation();
openModal('${tourId}')
"
>

✏️ Bearbeiten

</button>


<button
class="btn red"
onclick="
event.stopPropagation();
removeTour('${tourId}')
"
>

Löschen

</button>


</div>


</article>

`;

}).join("")

:

`

<div class="empty">

Noch keine Touren gespeichert.

<br>

Füge deine erste Tour hinzu! 🏔️

</div>

`;

}


loadTours();

</script>

</body>
</html>
