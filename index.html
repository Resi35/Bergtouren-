<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Bergtouren</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:#f3f6f3;
color:#20342b
}

header{
padding:28px 20px 34px;
color:#fff;
background:linear-gradient(135deg,#204c3b,#718a73);
border-radius:0 0 28px 28px
}

main{
max-width:900px;
margin:auto;
padding:18px
}

h1{margin:0 0 5px;font-size:29px}
.muted{opacity:.85}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:-8px
}

.stat,.card,.modalbox{
background:#fff;
border-radius:18px;
padding:16px;
box-shadow:0 3px 16px #0001
}

.stat b{
font-size:22px;
display:block
}

.stat small{color:#718078}

.toolbar{
display:flex;
gap:9px;
flex-wrap:wrap;
margin:18px 0
}

.btn{
border:0;
border-radius:12px;
padding:11px 15px;
background:#2f6751;
color:#fff;
font-weight:700;
cursor:pointer
}

.btn.alt{
background:#e4ece7;
color:#2d4b3d
}

.btn.red{
background:#b84b4b;
color:#fff
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:14px
}

.card{cursor:pointer}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
margin-bottom:10px
}

.card h3{margin:8px 0 5px}

.meta{
font-size:13px;
color:#66756c;
margin:7px 0
}

.badge{
display:inline-block;
border-radius:99px;
padding:5px 9px;
background:#e7f1eb;
color:#286044;
font-size:12px;
font-weight:700
}

.card p{line-height:1.45}

.empty{
text-align:center;
padding:35px;
color:#738078
}

.status{
text-align:center;
padding:8px;
border-radius:10px;
background:#eef4ef;
margin:10px 0;
font-size:13px
}

/* MODALS */

.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:16px;
z-index:10
}

.modal.open{display:flex}

.modalbox{
max-width:540px;
width:100%;
max-height:92vh;
overflow:auto
}

.close{float:right}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
display:block;
font-weight:700;
font-size:13px;
margin:12px 0 5px
}

input,textarea,select{
width:100%;
padding:11px;
border:1px solid #ccd6d0;
border-radius:10px;
font:inherit
}

textarea{min-height:85px}

.link{
color:#2f6751;
font-weight:700
}

.info{
background:#f0f5f1;
border-radius:12px;
padding:10px;
margin:10px 0
}

/* DETAILANSICHT */

.detail-cover{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:14px;
margin-bottom:14px;
cursor:pointer
}

.detail-title{
font-size:28px;
font-weight:700;
margin:5px 0 12px
}

.detail-section{
background:#f0f5f1;
border-radius:14px;
padding:13px;
margin:12px 0
}

.detail-buttons{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:16px
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px
}

.gallery img{
width:100%;
height:100px;
object-fit:cover;
border-radius:10px;
cursor:pointer
}

/* GESPEICHERTE FOTOS */

.saved-photo{
position:relative
}

.saved-photo img{
display:block
}

.delete-photo{
position:absolute;
top:5px;
right:5px;
width:34px;
height:34px;
padding:0;
border:0;
border-radius:50%;
background:#b84b4b;
color:#fff;
font-size:16px;
cursor:pointer
}

/* GROSSES BILD */

.image-modal{
position:fixed;
inset:0;
background:#000e;
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:30
}

.image-modal.open{
display:flex
}

.image-modal img{
max-width:100%;
max-height:90vh;
object-fit:contain;
border-radius:12px
}

.image-close{
position:absolute;
top:15px;
right:15px;
background:#fff;
color:#20342b;
border:0;
border-radius:50%;
width:42px;
height:42px;
font-size:22px;
font-weight:bold
}

@media(max-width:520px){

.stats{
grid-template-columns:1fr 1fr
}

.stat:last-child{
grid-column:span 2
}

.row{
grid-template-columns:1fr
}

.gallery{
grid-template-columns:repeat(3,1fr)
}

}
</style>
</head>

<body>

<header>

<h1>🏔️ Meine Bergtouren</h1>

<div class="muted">
Deine persönliche Sammlung von Touren
</div>

</header>

<main>

<div id="connection" class="status">
☁️ Verbindung wird hergestellt...
</div>

<div class="stats">

<div class="stat">
<b id="planned">0</b>
<small>Geplant</small>
</div>

<div class="stat">
<b id="done">0</b>
<small>Erledigt</small>
</div>

<div class="stat">
<b id="hm">0</b>
<small>Höhenmeter gesamt</small>
</div>

</div>

<div class="toolbar">

<button class="btn" onclick="openModal()">
＋ Tour hinzufügen
</button>

<button class="btn alt" onclick="filter='all';render()">
Alle
</button>

<button class="btn alt" onclick="filter='planned';render()">
Geplant
</button>

<button class="btn alt" onclick="filter='done';render()">
Erledigt
</button>

</div>

<div id="list" class="grid"></div>

</main>
